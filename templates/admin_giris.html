<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — QR Yoklama</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:40px 32px;width:100%;max-width:340px;text-align:center}
.icon{font-size:40px;margin-bottom:16px}
h1{font-size:20px;margin-bottom:6px}
.sub{color:#94a3b8;font-size:13px;margin-bottom:28px}
input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#f1f5f9;font-size:16px;padding:13px 16px;margin-bottom:12px;outline:none}
input:focus{border-color:#3b82f6}
.btn{width:100%;padding:13px;border-radius:10px;border:none;background:#3b82f6;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:#2563eb}
.info{margin-top:16px;font-size:12px;color:#64748b;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h1>Admin Paneli</h1>
  <p class="sub">QR Yoklama Sistemi</p>
  <input type="password" id="s" placeholder="Admin şifresi" autofocus>
  <button class="btn" onclick="gir()">Giriş Yap</button>
  <p class="info">Şifrenizi girdikten sonra admin paneline yönlendirileceksiniz.</p>
</div>
<script>
function gir(){
  const s=document.getElementById("s").value.trim();
  if(s) window.location.href="/admin/"+encodeURIComponent(s);
}
document.getElementById("s").addEventListener("keydown",e=>{ if(e.key==="Enter") gir(); });
</script>
</body>
</html>
